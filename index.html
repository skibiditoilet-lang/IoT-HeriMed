<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeriMed Care - Kê Đơn & Băng Chuyền EV3</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #198754;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --border-color: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.2rem;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 1.5rem; }
        header p { margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.9; }

        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .bluetooth-card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid var(--border-color);
        }

        .btn-connect {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-connect:hover { background-color: #0b5ed7; }

        .status {
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        .status.disconnected { background-color: #f8d7da; color: #842029; }
        .status.connected { background-color: #d1e7dd; color: #0f5132; }

        .herb-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .herb-item {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .herb-item.processing {
            border: 2px solid #ffc107;
            background-color: #fff3cd;
        }

        .herb-item.completed {
            border: 2px solid #198754;
            background-color: #d1e7dd;
        }

        .herb-info { flex: 1; min-width: 220px; }
        .herb-title { margin: 0 0 6px 0; color: var(--secondary-color); font-size: 1.2rem; }
        
        .herb-status-badge {
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
            background-color: #e9ecef;
            color: #495057;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f1f3f5;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .btn-qty {
            background-color: white;
            border: 1px solid #ced4da;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .qty-input {
            width: 40px;
            text-align: center;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            background: transparent;
        }

        .action-panel { margin-top: 25px; }

        .btn-send-all {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(25, 135, 84, 0.2);
            transition: 0.2s;
        }

        .btn-send-all:hover { background-color: #157347; }
        .btn-send-all:disabled { background-color: #6c757d; cursor: not-allowed; }

        .log-box {
            margin-top: 25px;
            background: #212529;
            color: #00ff66;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            height: 160px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>HeriMed Care - Đông Y & Kết Nối EV3</h1>
        <p>Hệ thống băng chuyền cấp thuốc tự động qua Robot EV3</p>
    </header>

    <div class="container">
        <!-- Panel Bluetooth -->
        <div class="bluetooth-card">
            <div>
                <strong>Trạng thái EV3:</strong> 
                <span id="btStatus" class="status disconnected">Chưa kết nối (Mô Phỏng)</span>
            </div>
            <button class="btn-connect" onclick="connectBluetooth()">Kết Nối Bluetooth EV3</button>
        </div>

        <!-- Danh sách chọn thuốc -->
        <h2>Đơn Thuốc Băng Chuyền</h2>
        <div class="herb-list">
            
            <!-- Trạm 1: Táo Tàu -->
            <div class="herb-item" id="item-TT">
                <div class="herb-info">
                    <h3 class="herb-title">Trạm 1: Táo Tàu</h3>
                    <span id="badge-TT" class="herb-status-badge">Sẵn sàng</span>
                </div>
                <div class="quantity-control">
                    <button class="btn-qty" onclick="changeQty('taoTau', -1)">-</button>
                    <input type="text" id="taoTau" class="qty-input" value="0" readonly>
                    <button class="btn-qty" onclick="changeQty('taoTau', 1)">+</button>
                </div>
            </div>

            <!-- Trạm 2: La Hán Quả -->
            <div class="herb-item" id="item-LHQ">
                <div class="herb-info">
                    <h3 class="herb-title">Trạm 2: La Hán Quả</h3>
                    <span id="badge-LHQ" class="herb-status-badge">Sẵn sàng</span>
                </div>
                <div class="quantity-control">
                    <button class="btn-qty" onclick="changeQty('laHanQua', -1)">-</button>
                    <input type="text" id="laHanQua" class="qty-input" value="0" readonly>
                    <button class="btn-qty" onclick="changeQty('laHanQua', 1)">+</button>
                </div>
            </div>

            <!-- Trạm 3: Đại Táo -->
            <div class="herb-item" id="item-DT">
                <div class="herb-info">
                    <h3 class="herb-title">Trạm 3: Đại Táo</h3>
                    <span id="badge-DT" class="herb-status-badge">Sẵn sàng</span>
                </div>
                <div class="quantity-control">
                    <button class="btn-qty" onclick="changeQty('daiTao', -1)">-</button>
                    <input type="text" id="daiTao" class="qty-input" value="0" readonly>
                    <button class="btn-qty" onclick="changeQty('daiTao', 1)">+</button>
                </div>
            </div>

        </div>

        <!-- Nút gửi lệnh -->
        <div class="action-panel">
            <button class="btn-send-all" id="btnSend" onclick="sendOrderToEV3()">Bắt Đầu Cho Băng Chuyền Chạy</button>
        </div>

        <!-- Nhật ký -->
        <h3>Nhật Ký Truyền Nhận</h3>
        <div class="log-box" id="logBox">> Hệ thống sẵn sàng...</div>
    </div>

    <script>
        let ev3Device = null;
        let gattServer = null;
        let rxCharacteristic = null;
        let isConnected = false;

        // Biến Promise dùng để tạm dừng JS chờ tin nhắn "DONE" từ EV3
        let ev3DoneResolver = null;

        const EV3_SERVICE_UUID = '00001101-0000-1000-8000-00805f9b34fb'; 
        const EV3_CHAR_UUID    = '00001101-0000-1000-8000-00805f9b34fb';

        function log(msg) {
            const logBox = document.getElementById('logBox');
            logBox.innerHTML += `<br>> ${msg}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function changeQty(id, delta) {
            const input = document.getElementById(id);
            let val = (parseInt(input.value) || 0) + delta;
            if (val < 0) val = 0;
            input.value = val;
        }

        async function connectBluetooth() {
            try {
                log('Đang tìm kiếm thiết bị EV3...');
                ev3Device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [EV3_SERVICE_UUID]
                });

                log(`Đã chọn: ${ev3Device.name}`);
                ev3Device.addEventListener('gattserverdisconnected', onDisconnected);
                
                gattServer = await ev3Device.gatt.connect();
                const service = await gattServer.getPrimaryService(EV3_SERVICE_UUID);
                rxCharacteristic = await service.getCharacteristic(EV3_CHAR_UUID);

                // Lắng nghe dữ liệu EV3 gửi ngược lại Web
                await rxCharacteristic.startNotifications();
                rxCharacteristic.addEventListener('characteristicvaluechanged', handleEV3Response);

                isConnected = true;
                log('Kết nối thành công Bluetooth EV3!');
                document.getElementById('btStatus').innerText = 'Đã kết nối EV3';
                document.getElementById('btStatus').className = 'status connected';

            } catch (error) {
                log(`Lỗi kết nối: ${error.message}`);
            }
        }

        function onDisconnected() {
            isConnected = false;
            log('Đã mất kết nối Bluetooth!');
            document.getElementById('btStatus').innerText = 'Chưa kết nối (Mô Phỏng)';
            document.getElementById('btStatus').className = 'status disconnected';
        }

        // Xử lý khi nhận dữ liệu từ EV3 gửi về Web
        function handleEV3Response(event) {
            let decoder = new TextDecoder('utf-8');
            let response = decoder.decode(event.target.value).trim();
            log(`EV3 Phản hồi: "${response}"`);

            // Nếu EV3 gửi chữ DONE, mở khóa cho Web chạy tiếp
            if (response.includes('DONE') && ev3DoneResolver) {
                log('✔ Nhận tín hiệu DONE từ EV3. Chuyển trạm tiếp theo!');
                ev3DoneResolver();
                ev3DoneResolver = null;
            }
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // HÀM XỬ LÝ CHỜ ĐỜI TẠI MỖI TRẠM
        function waitForEV3Done(simTimeoutMs) {
            return new Promise((resolve) => {
                if (isConnected) {
                    // NẾU CÓ BLUETOOTH THẬT: Đứng chờ VÔ THỜI HẠN đến khi EV3 gửi chữ "DONE"
                    log('Đang đứng chờ robot EV3 trả về tín hiệu "DONE"...');
                    ev3DoneResolver = resolve;
                } else {
                    // NẾU CHẠY MÔ PHỎNG: Tự động đếm 1.5 giây/viên rồi chạy tiếp
                    log(`[Mô Phỏng] Đang chờ mô phỏng: ${simTimeoutMs / 1000} giây...`);
                    setTimeout(() => {
                        resolve();
                    }, simTimeoutMs);
                }
            });
        }

        function updateStatusUI(code, stateText, className) {
            const item = document.getElementById(`item-${code}`);
            const badge = document.getElementById(`badge-${code}`);
            
            item.className = `herb-item ${className}`;
            badge.innerText = stateText;
        }

        async function sendOrderToEV3() {
            const taoTau = parseInt(document.getElementById('taoTau').value) || 0;
            const laHanQua = parseInt(document.getElementById('laHanQua').value) || 0;
            const daiTao = parseInt(document.getElementById('daiTao').value) || 0;

            if (taoTau === 0 && laHanQua === 0 && daiTao === 0) {
                alert('Vui lòng chọn số lượng cho ít nhất 1 loại thuốc!');
                return;
            }

            document.getElementById('btnSend').disabled = true;

            let queue = [];
            if (taoTau > 0) queue.push({ code: 'TT', qty: taoTau, name: 'Táo Tàu' });
            if (laHanQua > 0) queue.push({ code: 'LHQ', qty: laHanQua, name: 'La Hán Quả' });
            if (daiTao > 0) queue.push({ code: 'DT', qty: daiTao, name: 'Đại Táo' });

            log(`=== BẮT ĐẦU CHẠY BĂNG CHUYỀN (${queue.length} Trạm) ===`);

            for (let item of queue) {
                // 1. Cập nhật UI: Đang xả thuốc
                updateStatusUI(item.code, `Đang xả thuốc (${item.qty} viên)...`, 'processing');
                
                let msg = `${item.code} ${item.qty}`;
                log(`Gửi lệnh Trạm [${item.name}]: "${msg}"`);

                // 2. Gửi lệnh Bluetooth tới EV3
                if (isConnected && rxCharacteristic) {
                    try {
                        let encoder = new TextEncoder();
                        await rxCharacteristic.writeValue(encoder.encode(msg + '\n'));
                    } catch (e) {
                        log(`Lỗi phát lệnh: ${e.message}`);
                    }
                }

                // 3. Tính thời gian đếm giờ mô phỏng (1.5s x số lượng)
                let simTimeout = item.qty * 1500; 

                // 4. CHỜ THỰC THI (Chờ "DONE" từ EV3 hoặc chờ 1.5s mô phỏng)
                await waitForEV3Done(simTimeout);

                // 5. Cập nhật UI: Đã lấy xong!
                updateStatusUI(item.code, `Đã lấy xong (${item.qty} viên)`, 'completed');
                
                await sleep(500); // Trễ nhỏ 0.5s giữa các trạm
            }

            log(`=== HOÀN THÀNH TOÀN BỘ ĐƠN THUỐC ===`);
            document.getElementById('btnSend').disabled = false;
        }
    </script>
</body>
</html>
